<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3f7">
  <meta name="description" content="Datesino — слот-машина в Telegram">
  <title>Datesino</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23552143'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='38' font-family='Georgia' font-weight='bold' fill='%23f7d58e'%3ED%3C/text%3E%3C/svg%3E">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f3f7;
      --paper: #fffdf9;
      --ink: #211c28;
      --muted: #79717f;
      --plum: #552143;
      --gold: #f6d491;
      --line: #dcd7df;
      --cell: clamp(100px, 30vw, 132px);
      --peek: clamp(34px, 10vw, 48px);
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; min-width: 280px; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    button { font: inherit; cursor: pointer; }
    .app { width: min(100%, 480px); min-height: 100vh; min-height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; background: var(--bg); }
    .content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .view[hidden] { display: none; }
    .home-view { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: max(19px, env(safe-area-inset-top)) 16px 22px; }
    .logo { margin: 0; text-align: center; color: var(--plum); font: 700 clamp(2.4rem, 10vw, 3.4rem)/1 "Bodoni MT", Didot, "Iowan Old Style", Georgia, serif; letter-spacing: -.07em; }
    .logo::first-letter { font-style: italic; }
    .slot-stage { flex: 1; min-height: 300px; display: grid; place-items: center; }
    .slot-stack { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
    .machine { width: 100%; padding: 7px; border-radius: 17px; background: var(--ink); box-shadow: 0 14px 0 #d8d3dc, 0 26px 34px #39263724; }
    .reels { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: calc(var(--cell) + 2 * var(--peek)); overflow: hidden; border-radius: 10px; background: var(--paper); }
    .reel-window { position: relative; min-width: 0; height: 100%; overflow: hidden; border-right: 3px solid var(--ink); }
    .reel-window:nth-child(3) { border-right: 0; }
    .reel-track { display: flex; flex-direction: column; will-change: transform; }
    .symbol { flex: none; height: var(--cell); display: grid; place-items: center; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-size: clamp(2.8rem, 13vw, 4.4rem); line-height: 1; user-select: none; }
    .symbol.seven { color: #b3354c; font: 900 clamp(3.6rem, 18vw, 6rem)/1 Georgia, serif; text-shadow: 2px 3px 0 #f6d491; }
    .payline { position: absolute; z-index: 2; left: 0; right: 0; height: 3px; background: var(--ink); pointer-events: none; }
    .payline.top { top: var(--peek); }
    .payline.bottom { top: calc(var(--peek) + var(--cell)); }
    .reels::before, .reels::after { content: ""; position: absolute; z-index: 1; left: 0; right: 0; height: var(--peek); pointer-events: none; }
    .reels::before { top: 0; background: linear-gradient(to bottom, #fffdf9cc, transparent); }
    .reels::after { bottom: 0; background: linear-gradient(to top, #fffdf9cc, transparent); }
    .spin-button { min-width: 216px; min-height: 63px; padding: 11px 30px 12px; border: 2px solid var(--ink); border-radius: 12px; background: var(--plum); color: var(--gold); box-shadow: 0 5px 0 var(--ink), 0 12px 20px #55214324; font: 700 1.55rem/1 "Bodoni MT", Didot, "Iowan Old Style", Georgia, serif; letter-spacing: .035em; transition: transform .16s ease, box-shadow .16s ease, filter .16s ease; }
    .spin-button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink), 0 5px 12px #55214324; }
    .spin-button:disabled { cursor: wait; filter: saturate(.75); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .profile-view { padding: max(24px, env(safe-area-inset-top)) 20px 32px; }
    .profile-view .eyebrow { margin: 0 0 9px; color: var(--plum); font-size: .78rem; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    .profile-view h1 { margin: 0; font-size: clamp(2rem, 8vw, 2.65rem); line-height: 1.08; letter-spacing: -.05em; }
    .intro { margin: 13px 0 28px; color: var(--muted); }
    .card { border-radius: 22px; background: #fff; border: 1px solid var(--line); box-shadow: 0 10px 30px #3926370a; }
    .identity { display: flex; align-items: center; gap: 15px; padding: 19px; }
    .avatar { flex: none; width: 58px; height: 58px; border-radius: 19px; display: grid; place-items: center; background: #f4e5ef; color: var(--plum); font-size: 1.4rem; font-weight: 750; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .identity-text { min-width: 0; flex: 1; }
    .identity-text strong { display: block; font-size: 1.12rem; overflow-wrap: anywhere; }
    .identity-text span { display: block; color: var(--muted); font-size: .87rem; overflow-wrap: anywhere; }
    .details { margin-top: 26px; overflow: hidden; }
    .detail { display: flex; gap: 20px; justify-content: space-between; align-items: baseline; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .detail:last-child { border-bottom: 0; }
    .detail span { color: var(--muted); }
    .detail strong { text-align: right; font-weight: 650; overflow-wrap: anywhere; min-width: 0; }
    .note { margin: 17px 2px 0; font-size: .82rem; color: var(--muted); }
    .nav { position: sticky; bottom: 0; display: flex; background: #fff; border-top: 1px solid var(--line); padding: 8px 12px max(9px, env(safe-area-inset-bottom)); }
    .nav button { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 14px; min-height: 54px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; font-size: .76rem; font-weight: 650; }
    .nav button[aria-current="page"] { color: var(--plum); background: #f4e9f0; }
    .nav svg { width: 22px; height: 22px; }
    :focus-visible { outline: 3px solid var(--plum); outline-offset: 3px; }
    @media (max-height: 570px) { .home-view { padding-top: 12px; padding-bottom: 8px; } .slot-stage { min-height: 245px; } .slot-stack { gap: 16px; } }
    @media (min-width: 600px) { .app { min-height: min(850px, 100dvh); margin: 24px auto; border-radius: 28px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 18px 60px #0002; } }
    @media (prefers-reduced-motion: reduce) { .spin-button { transition: none; } }
  </style>
</head>
<body>
  <div class="app">
    <main class="content" id="main">
      <section class="view home-view" id="home-view" aria-labelledby="home-title">
        <h1 class="logo" id="home-title">Datesino</h1>
        <div class="slot-stage">
          <div class="slot-stack">
            <div class="machine" id="machine" role="img" aria-label="Слот-машина: три барабана">
              <div class="reels" aria-hidden="true">
                <div class="reel-window"><div class="reel-track"></div></div>
                <div class="reel-window"><div class="reel-track"></div></div>
                <div class="reel-window"><div class="reel-track"></div></div>
                <div class="payline top"></div><div class="payline bottom"></div>
              </div>
            </div>
            <button class="spin-button" id="spin-button" type="button">Крутить</button>
            <span class="sr-only" id="spin-result" role="status" aria-live="polite"></span>
          </div>
        </div>
      </section>
      <section class="view profile-view" id="profile-view" aria-labelledby="profile-title" hidden>
        <p class="eyebrow">Аккаунт</p><h1 id="profile-title">Мой профиль</h1>
        <p class="intro">Информация из вашего аккаунта Telegram.</p>
        <div class="card identity"><div class="avatar" id="profile-avatar" aria-hidden="true">Г</div><div class="identity-text"><strong id="profile-name">Гость</strong><span id="profile-username">Нет имени пользователя</span></div></div>
        <div class="card details"><div class="detail"><span>ID</span><strong id="profile-id">—</strong></div><div class="detail"><span>Язык</span><strong id="profile-language">—</strong></div></div>
        <p class="note">Данные отображаются только на вашем устройстве.</p>
      </section>
    </main>
    <nav class="nav" aria-label="Основная навигация">
      <button type="button" data-go="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V10Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Главная</button>
      <button type="button" data-go="profile"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 20c.3-4 2.8-6 7-6s6.7 2 7 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Профиль</button>
    </nav>
  </div>
  <script>
    (() => {
      const tg = window.Telegram?.WebApp;
      const user = tg?.initDataUnsafe?.user;
      const $ = id => document.getElementById(id);
      const fullName = user ? [user.first_name, user.last_name].filter(Boolean).join(' ').trim() || 'Пользователь' : 'Гость';
      const firstName = user?.first_name || 'Гость';
      const username = user?.username ? '@' + user.username : 'Нет имени пользователя';
      $('profile-name').textContent = fullName;
      $('profile-username').textContent = username;
      $('profile-id').textContent = user?.id ? String(user.id) : '—';
      $('profile-language').textContent = user?.language_code || '—';
      $('profile-avatar').textContent = Array.from(firstName)[0]?.toLocaleUpperCase() || 'Г';
      if (user?.photo_url) {
        const img = document.createElement('img');
        img.alt = '';
        img.referrerPolicy = 'no-referrer';
        img.src = user.photo_url;
        img.onerror = () => img.remove();
        $('profile-avatar').replaceChildren(img);
      }

      const symbols = ['🍒', '🍋', '💎', '⭐', '🍀', '7', '❤️'];
      const reels = Array.from(document.querySelectorAll('.reel-window'));
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const randomSymbol = () => symbols[Math.floor(Math.random() * symbols.length)];
      const windows = [
        ['🍋', '⭐', '🍒', '💎', '🍀'],
        ['💎', '🍒', '7', '⭐', '🍋'],
        ['🍀', '7', '💎', '❤️', '🍒']
      ];
      let spinning = false;

      function position(reel, index) {
        const cell = reel.querySelector('.symbol').getBoundingClientRect().height;
        const peek = (reel.clientHeight - cell) / 2;
        return peek - index * cell;
      }
      function render(reel, items, index) {
        const track = reel.querySelector('.reel-track');
        track.style.transition = 'none';
        track.replaceChildren(...items.map(value => {
          const el = document.createElement('span');
          el.className = 'symbol' + (value === '7' ? ' seven' : '');
          el.textContent = value;
          return el;
        }));
        track.style.transform = `translate3d(0, ${position(reel, index)}px, 0)`;
        return track;
      }
      reels.forEach((reel, i) => render(reel, windows[i], 2));
      window.addEventListener('resize', () => {
        if (!spinning) reels.forEach((reel, i) => render(reel, windows[i], 2));
      });

      $('spin-button').addEventListener('click', () => {
        if (spinning) return;
        spinning = true;
        $('spin-button').disabled = true;
        $('spin-result').textContent = '';
        const outcomes = [];
        const duration = reducedMotion.matches ? 0 : 1750;
        reels.forEach((reel, i) => {
          const items = [...windows[i], ...Array.from({length: 18}, randomSymbol)];
          const target = items.length - 3;
          outcomes[i] = items[target];
          const track = render(reel, items, 2);
          // Layout is read before the transition so each spin starts from the displayed symbols.
          track.getBoundingClientRect();
          requestAnimationFrame(() => {
            track.style.transition = duration ? `transform ${duration + i * 280}ms cubic-bezier(.13,.63,.18,1)` : 'none';
            track.style.transform = `translate3d(0, ${position(reel, target)}px, 0)`;
          });
          windows[i] = items.slice(target - 2, target + 3);
        });
        tg?.HapticFeedback?.impactOccurred?.('light');
        setTimeout(() => {
          spinning = false;
          $('spin-button').disabled = false;
          if (!$('home-view').hidden) reels.forEach((reel, i) => render(reel, windows[i], 2));
          $('machine').setAttribute('aria-label', 'Результат: ' + outcomes.join(', '));
          $('spin-result').textContent = 'Результат: ' + outcomes.join(', ');
          tg?.HapticFeedback?.notificationOccurred?.('success');
        }, duration + (reels.length - 1) * (duration ? 280 : 0) + 80);
      });

      function show(view) {
        for (const name of ['home', 'profile']) $(name + '-view').hidden = name !== view;
        if (view === 'home' && !spinning) reels.forEach((reel, i) => render(reel, windows[i], 2));
        for (const button of document.querySelectorAll('.nav button')) {
          if (button.dataset.go === view) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        }
        tg?.HapticFeedback?.selectionChanged?.();
        if (view === 'profile') tg?.BackButton?.show?.();
        else tg?.BackButton?.hide?.();
        window.scrollTo(0, 0);
      }
      document.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => show(button.dataset.go)));
      tg?.BackButton?.onClick?.(() => show('home'));
      tg?.ready?.();
      tg?.expand?.();
    })();
  </script>
</body>
</html>
